name: wassalny_captain
description: "Wassalny Captain — a production-ready ride-hailing driver app built with Clean Architecture, BLoC and Supabase."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Dependency injection
  get_it: ^7.7.0

  # Navigation
  go_router: ^14.2.7

  # Functional error handling
  dartz: ^0.10.1

  # Backend (isolated inside the data layer only)
  supabase_flutter: ^2.5.6

  # Maps
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1

  # Typography
  google_fonts: ^6.2.1
  firebase_core: ^4.13.0

  # Date/number formatting
  intl: ^0.20.2

  # Local settings persistence
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/

# App launcher icon generation.
# Generate platform icons after `flutter create .` with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
