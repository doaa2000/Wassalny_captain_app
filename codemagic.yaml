workflows:
  android-internal:
    name: Android – Internal testing
    max_build_duration: 60
    instance_type:  mac_mini_m2
    environment:
      groups:
        - google_play
        - google_maps
      vars:
        PACKAGE_NAME: "eg.wassalny.captain"
      android_signing:
        -  wassalny-captain
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Write Maps API key into local.properties
        script: |
          echo "MAPS_API_KEY=$MAPS_API_KEY" > "$CM_BUILD_DIR/android/local.properties"
      - name: Write release signing config into key.properties
        script: |
          cat >"$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Build appbundle
        script: |
          flutter build appbundle --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - doaaabdeen9@gmail.com
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false
